server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Frontend
    location / {
        try_files $uri $uri/ =404;
    }
    
    location = / {
        try_files /index.html =404;
    }
    
    # Backend API Proxy - nur über Nginx erreichbar
    location /api/ {
        # Intern an localhost:8000 weiterleiten
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Sicherheits-Headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Story-Generierung kann bei langen Texten oder langsameren Modellen
        # die Nginx-Default-Timeouts (60s) überschreiten
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Story-Generierung wird als NDJSON gestreamt - ohne dies würde Nginx
        # die komplette Antwort puffern und erst am Ende ausliefern
        proxy_buffering off;
    }
    
    # Health Check - intern
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
    
    # API Info endpoint
    location = /api {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Cache-Control für statische Assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        # add_header in dieser location überschreibt die vom server-Block
        # geerbten Header vollständig, daher hier erneut einbinden
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker: nie langfristig cachen (auch nicht per Browser-
    # Heuristik) - sonst bekommen Clients neue Deployments erst nach
    # Ablauf eines veralteten Caches mit. exact match schlägt die obige
    # \.js$-Regel (Nginx bevorzugt exakte Matches vor Regex-Locations).
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Web App Manifest: korrekten MIME-Type setzen, da .webmanifest nicht in
    # Nginx' Standard-mime.types enthalten ist
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
    }
}
