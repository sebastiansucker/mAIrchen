<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mAIrchen - Geschichten für Kinder</title>
    <!-- Apple Touch Icon für iOS Home Screen (PNG erforderlich) -->
    <link rel="apple-touch-icon" href="app_icon.png">

    <!-- Favicon für Browser -->
    <link rel="icon" type="image/x-icon" href="app_icon.png">
    <link rel="icon" type="image/svg+xml" href="app_icon.svg">

    <!-- Meta-Tags für iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="mAIrchen">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Eingabeformular -->
        <div id="input-form" class="app-panel" style="position: relative;">
            <header>
                <div class="logo-mark" aria-hidden="true">
                    <span class="logo-mark-left"></span>
                    <span class="logo-mark-right"></span>
                    <span class="logo-mark-spark"></span>
                </div>
                <h1>mAIrchen</h1>
                <p class="subtitle">Deine persönliche Geschichtenerzähler-App</p>
            </header>

            <main class="app-panel-body">
                <div class="form-group">
                    <label id="grade-label">Klassenstufe:</label>
                    <div class="grade-buttons" role="radiogroup" aria-labelledby="grade-label">
                        <button type="button" class="grade-btn" data-grade="12" role="radio" aria-checked="false">1./2. Klasse</button>
                        <button type="button" class="grade-btn active" data-grade="34" role="radio" aria-checked="true">3./4. Klasse</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="thema">Thema:</label>
                    <input type="text" id="thema" placeholder="z.B. Freundschaft, Abenteuer, Zauber" aria-describedby="thema-error">
                    <span id="thema-error" class="field-error" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="personen">Personen/Tiere:</label>
                    <input type="text" id="personen" placeholder="z.B. Ein kleiner Hase, Eine mutige Prinzessin" aria-describedby="personen-error">
                    <span id="personen-error" class="field-error" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="ort">Ort:</label>
                    <input type="text" id="ort" placeholder="z.B. im Wald, am See, in einem Schloss" aria-describedby="ort-error">
                    <span id="ort-error" class="field-error" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="stimmung">Stimmung:</label>
                    <input type="text" id="stimmung" placeholder="z.B. fröhlich, spannend, lustig" aria-describedby="stimmung-error">
                    <span id="stimmung-error" class="field-error" role="alert"></span>
                    <div class="mood-chips">
                        <button type="button" class="mood-chip" data-mood="Fröhlich">Fröhlich</button>
                        <button type="button" class="mood-chip" data-mood="Spannend">Spannend</button>
                        <button type="button" class="mood-chip" data-mood="Beruhigend">Beruhigend</button>
                        <button type="button" class="mood-chip" data-mood="Lustig">Lustig</button>
                        <button type="button" class="mood-chip" data-mood="Mutig">Mutig</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="stil">Stil/Genre <span style="color: var(--text-lighter);">(optional)</span>:</label>
                    <input type="text" id="stil" placeholder="z.B. Michael Ende, Astrid Lindgren, Märchen, Fabel">
                </div>

                <div class="form-group">
                    <label id="length-label">Länge der Geschichte:</label>
                    <div class="length-buttons" role="radiogroup" aria-labelledby="length-label">
                        <button type="button" class="length-btn" data-length="5" role="radio" aria-checked="false">5 Min</button>
                        <button type="button" class="length-btn active" data-length="10" role="radio" aria-checked="true">10 Min</button>
                        <button type="button" class="length-btn" data-length="15" role="radio" aria-checked="false">15 Min</button>
                    </div>
                </div>

                <button type="button" id="random-btn" class="btn btn-secondary">🎲 Zufällig ausfüllen</button>
            </main>

            <div class="form-footer">
                <button id="generate-btn" class="btn btn-primary">✨ Geschichte erstellen</button>
            </div>

            <!-- Lade-Animation Overlay -->
            <div id="loading" class="loading-overlay" style="display: none;">
                <span class="loading-sparkle s1"></span>
                <span class="loading-sparkle s2"></span>
                <span class="loading-sparkle s3"></span>
                <span class="loading-sparkle s4"></span>
                <span class="loading-sparkle s5"></span>
                <span class="loading-sparkle s6"></span>
                <span class="loading-sparkle s7"></span>

                <div class="loading-content">
                    <div class="book-loader">
                        <div class="book-loader-book">
                            <div class="book-loader-spine"></div>
                            <div class="book-loader-page left">
                                <span class="book-loader-line" style="width:90%"></span>
                                <span class="book-loader-line" style="width:70%"></span>
                                <span class="book-loader-line" style="width:80%"></span>
                            </div>
                            <div class="book-loader-page right">
                                <span class="book-loader-line" style="width:85%"></span>
                                <span class="book-loader-line" style="width:65%"></span>
                            </div>
                            <div class="book-loader-flip">
                                <div class="book-loader-flip-face front">
                                    <span class="book-loader-line" style="width:85%"></span>
                                    <span class="book-loader-line" style="width:65%"></span>
                                    <span class="book-loader-line" style="width:75%"></span>
                                </div>
                                <div class="book-loader-flip-face back">
                                    <span class="book-loader-line" style="width:70%"></span>
                                    <span class="book-loader-line" style="width:80%"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <p class="loading-title">Es war einmal &hellip;</p>
                    <p class="loading-text">
                        Deine Geschichte wird geschrieben
                        <span class="loading-dots">
                            <span></span><span></span><span></span>
                        </span>
                    </p>
                    <div class="loading-progress">
                        <div class="loading-progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Geschichtenanzeige -->
        <div id="story-display" class="app-panel book-closed" style="display: none;">
            <div class="book-header">
                <button id="back-btn" class="icon-btn" aria-label="Zurück">
                    <svg width="9" height="15" viewBox="0 0 9 15"><path d="M8 1L1.5 7.5L8 14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="book-header-actions">
                    <button id="copy-btn" class="icon-btn" aria-label="Geschichte in die Zwischenablage kopieren">
                        <svg width="14" height="14" viewBox="0 0 14 14"><rect x="5.5" y="5.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M3.5 8.5H2.8A1.3 1.3 0 0 1 1.5 7.2V2.8A1.3 1.3 0 0 1 2.8 1.5H7.2A1.3 1.3 0 0 1 8.5 2.8V3.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
                    </button>
                    <button id="print-btn" class="icon-btn" aria-label="Geschichte drucken">
                        <svg width="14" height="14" viewBox="0 0 14 14"><rect x="3" y="1.5" width="8" height="3.5" rx="0.5" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1.5" y="5" width="11" height="5.5" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="4" y="8" width="6" height="4" fill="currentColor"/></svg>
                    </button>
                    <button id="share-btn" class="icon-btn" aria-label="Geschichte als Datei teilen">
                        <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="3" cy="7" r="2" fill="currentColor"/><circle cx="11" cy="2.5" r="2" fill="currentColor"/><circle cx="11" cy="11.5" r="2" fill="currentColor"/><line x1="4.7" y1="6" x2="9.3" y2="3.3" stroke="currentColor" stroke-width="1.3"/><line x1="4.7" y1="8" x2="9.3" y2="10.7" stroke="currentColor" stroke-width="1.3"/></svg>
                    </button>
                </div>
            </div>

            <div id="story-cover" class="story-cover">
                <span class="story-cover-label">Illustration wird geladen &hellip;</span>
            </div>

            <div class="story-body">
                <div id="story-badges" class="story-badges">
                    <span id="badge-grade" class="story-badge grade"></span>
                    <span id="badge-length" class="story-badge length"></span>
                </div>
                <h1 id="story-title" class="story-title"></h1>
                <div id="story-content" class="story-text"></div>
            </div>

            <div id="story-details" class="story-details">
                <button type="button" id="story-details-toggle" class="story-details-toggle">
                    <span>Details deiner Geschichte</span>
                    <span class="story-details-chevron">
                        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1l5 4-5 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                </button>
                <div class="story-details-body">
                    <div class="story-details-item">
                        <div class="label">Thema</div>
                        <div class="value" id="info-thema"></div>
                    </div>
                    <div class="story-details-item">
                        <div class="label">Personen/Tiere</div>
                        <div class="value" id="info-personen"></div>
                    </div>
                    <div class="story-details-item">
                        <div class="label">Ort</div>
                        <div class="value" id="info-ort"></div>
                    </div>
                    <div class="story-details-item">
                        <div class="label">Stimmung</div>
                        <div class="value" id="info-stimmung"></div>
                    </div>
                    <div class="story-details-item" id="stil-row">
                        <div class="label">Stil/Genre</div>
                        <div class="value" id="info-stil"></div>
                    </div>
                    <div class="story-details-item">
                        <div class="label">Grundwortschatz-Wörter</div>
                        <div class="value" id="info-grundwortschatz"></div>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <button id="new-story-btn" class="btn btn-outline">Neue Geschichte</button>
            </div>
        </div>

        <footer>
            <p>Powered by <a href="about.html" target="_blank">Open Source</a></p>
        </footer>
    </div>

    <script src="illustration.js"></script>
    <script src="app.js"></script>
</body>
</html>
