server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header (siehe docker/security-headers.conf für die
    # produktiv genutzte, kombinierte Nginx-Konfiguration)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-Control für statische Assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Dateinamen sind nicht versioniert: "no-cache" heißt per ETag
        # revalidieren, sonst behalten Browser nach einem Deployment die alte
        # app.js/styles.css bis zu einem Jahr. Gilt auch für /sw.js.
        add_header Cache-Control "no-cache";
    }

    # Web App Manifest: korrekten MIME-Type setzen, da .webmanifest nicht in
    # Nginx' Standard-mime.types enthalten ist
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
